<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BLINDGRID</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css?v=43">
<style>
  /* критический инлайн-стиль лоадера: применяется с первого кадра, до загрузки index.css,
     поэтому меню не успевает мелькнуть */
  #loader {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--tg-theme-bg-color, #1a1828);
    transition: opacity 0.35s ease;
  }
  #loader .loader-spin {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.14);
    border-top-color: #7d6fe0;
    animation: loader-spin 0.8s linear infinite;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  @keyframes loader-spin { to { transform: rotate(360deg); } }
  /* контент скрыт, пока лоадер не уйдёт — меню не мелькнёт ни на кадр */
  body { background: var(--tg-theme-bg-color, #1a1828); }
  #game, #app-version { visibility: hidden; }
  body.ready #game, body.ready #app-version { visibility: visible; }
</style>
</head>
<body>
<div id="loader"><div class="loader-spin"></div></div>
<span id="app-version">v1.2.9.4</span>
<div id="game">
  <div id="particles"></div>

  <div id="header">
    <div id="title"><svg class="logo-cross" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg><span class="logo-text">BLINDGRID</span><span class="logo-cube"></span></div>
  </div>

  <div class="screen active" id="placement-screen">
    <div id="place-board-wrap">
      <div class="board-label">
        <span>твоё поле</span>
        <span class="fleet-bar"><span class="fill" id="place-fill"></span></span>
      </div>
      <div class="grid" id="place-board"></div>
    </div>
    <div id="dock">
      <div id="dock-title">твои фигуры</div>
      <div id="dock-pieces"></div>
    </div>
    <div id="play-window">
      <button id="play-btn">Играть
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 4 L20 12 L6 20 Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="screen" id="battle-screen">
    <div class="board-section board-section-mini">
      <div class="board-label">
        <span>твоё поле</span>
        <span class="fleet-bar"><span class="fill" id="my-fill"></span></span>
      </div>
      <div class="grid" id="battle-my-board"></div>
    </div>
    <div id="turn-zone">
      <div id="turn-arrow" class="down">
        <svg viewBox="0 0 28 28" width="28" height="28">
          <path class="tri" d="M8 8.5 Q5.5 8.5 7 11 L11.5 18.5 Q14 22.5 16.5 18.5 L21 11 Q22.5 8.5 20 8.5 Z"/>
        </svg>
      </div>
    </div>
    <div class="board-section" style="position:relative;">
      <div class="board-label">
        <span>поле противника</span>
        <span class="fleet-bar"><span class="fill" id="enemy-fill"></span></span>
      </div>
      <div class="grid" id="enemy-board"></div>
      <div id="combo-tag"></div>
    </div>
  </div>

  <div id="controls"></div>
  <div id="drag-ghost" style="display:none"></div>

  <div id="menu">
    <div id="menu-particles"></div>
    <div id="menu-logo">
      <svg class="logo-cross" viewBox="0 0 24 24" width="34" height="34"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg><span class="logo-text">BLINDGRID</span><span class="logo-cube"></span>
    </div>
    <div id="menu-buttons">
      <button class="btn menu-btn menu-btn-secondary" id="menu-play">
        <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 L19 12 L7 19 Z"/></svg>
        <span>Играть</span>
      </button>
      <button class="btn menu-btn menu-btn-secondary" id="menu-friends">
        <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19 a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="7.5" r="2.4"/><path d="M16 13.5 a4.5 4.5 0 0 1 4.5 4.5"/></svg>
        <span>Друзья</span>
      </button>
      <button class="btn menu-btn menu-btn-secondary" id="menu-settings">
        <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 a9 9 0 1 0 0 18 c1.4 0 2.2-1 2.2-2 0-1.3-1-1.6-1-2.6 0-.8.7-1.4 1.6-1.4 H17 a4 4 0 0 0 4-4 c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg>
        <span>Кастомизация</span>
      </button>
    </div>
  </div>

  <div id="custom-select" class="hidden">
    <div id="custom-particles"></div>
    <div class="mode-topbar">
      <svg class="logo-cross topbar-cross" id="custom-back-x" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      <span class="logo-text">BLINDGRID</span>
      <span class="logo-cube"></span>
    </div>
    <div id="custom-center">
      <div class="custom-card">
        <div class="custom-card-head">
          <div class="cc-label-wrap">
            <span class="custom-section-label">Тёмная тема</span>
            <span class="custom-section-cap">фон и поля станут тёмными</span>
          </div>
          <button id="theme-switch" class="toggle-switch" role="switch" aria-label="тёмная тема">
            <span class="toggle-knob">
              <svg class="toggle-ico ico-sun" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5 v2 M12 19.5 v2 M2.5 12 h2 M19.5 12 h2 M5.2 5.2 l1.4 1.4 M17.4 17.4 l1.4 1.4 M18.8 5.2 l-1.4 1.4 M6.6 17.4 l-1.4 1.4"/></svg>
              <svg class="toggle-ico ico-moon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5 A8 8 0 0 1 9.5 4 a7 7 0 1 0 10.5 10.5z"/></svg>
            </span>
          </button>
        </div>
      </div>

      <div class="custom-card">
        <span class="custom-section-label">Стиль фигур</span>
        <div id="style-toggle">
          <button class="style-opt" id="style-classic" data-style="classic">
            <span class="style-check"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13 l4 4 L19 7"/></svg></span>
            <div class="style-preview" id="preview-classic"></div>
            <span class="style-name">Классика</span>
          </button>
          <button class="style-opt" id="style-flowers" data-style="flowers">
            <span class="style-check"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13 l4 4 L19 7"/></svg></span>
            <div class="style-preview" id="preview-flowers"></div>
            <span class="style-name">Цветочки</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="gametype-select" class="hidden">
    <div id="gametype-particles"></div>
    <div class="mode-topbar">
      <svg class="logo-cross topbar-cross" id="gametype-back-x" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      <span class="logo-text">BLINDGRID</span>
      <span class="logo-cube"></span>
    </div>
    <div class="pf-window">
      <div class="pf-card">
        <div class="pf-info">
          <span class="pf-name">Игрок</span>
          <span class="pf-rank">Бронза I</span>
          <div class="pf-xp"><span class="pf-xp-fill"></span></div>
        </div>
        <div class="pf-frame"><div class="pf-avatar"></div></div>
      </div>
      <div class="pf-scrollbar"><span class="pf-scrollbar-thumb"></span></div>
    </div>
    <div id="gametype-center">
      <div id="gametype-buttons">
        <button class="btn menu-btn menu-btn-secondary" id="gt-sea">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9 h18 M3 15 h18 M9 3 v18 M15 3 v18"/></svg>
          Морской бой
        </button>
        <button class="btn menu-btn menu-btn-secondary" id="gt-snake">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6 h7 a3 3 0 0 1 0 6 H8 a3 3 0 0 0 0 6 h6"/><circle cx="18.5" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>
          Змейка
        </button>
      </div>
    </div>
  </div>

  <div id="opp-select" class="hidden">
    <div id="opp-particles"></div>
    <div class="mode-topbar">
      <svg class="logo-cross topbar-cross" id="opp-back-x" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      <span class="logo-text">BLINDGRID</span>
      <span class="logo-cube"></span>
    </div>
    <div class="pf-window">
      <div class="pf-card">
        <div class="pf-info">
          <span class="pf-name">Игрок</span>
          <span class="pf-rank">Бронза I</span>
          <div class="pf-xp"><span class="pf-xp-fill"></span></div>
        </div>
        <div class="pf-frame"><div class="pf-avatar"></div></div>
      </div>
      <div class="pf-scrollbar"><span class="pf-scrollbar-thumb"></span></div>
    </div>
    <div id="opp-center">
      <div id="opp-buttons">
        <button class="btn menu-btn menu-btn-secondary" id="opp-ai">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2.5"/><path d="M10 3 v4 M14 3 v4 M10 17 v4 M14 17 v4 M3 10 h4 M3 14 h4 M17 10 h4 M17 14 h4"/></svg>
          <span>Против ИИ</span>
        </button>
        <button class="btn menu-btn menu-btn-secondary" id="opp-pvp">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="8" r="2.6"/><path d="M2.5 19 a4 4 0 0 1 8 0"/><circle cx="17.5" cy="8" r="2.6"/><path d="M13.5 19 a4 4 0 0 1 8 0"/></svg>
          <span>Против игрока</span>
        </button>
      </div>
    </div>
  </div>

  <div id="mode-select" class="hidden" data-gt="sea">
    <div id="mode-particles"></div>
    <div class="mode-topbar">
      <svg class="logo-cross topbar-cross" id="mode-back-x" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      <span class="logo-text">BLINDGRID</span>
      <span class="logo-cube"></span>
    </div>
    <div class="pf-window">
      <div class="pf-card">
        <div class="pf-info">
          <span class="pf-name">Игрок</span>
          <span class="pf-rank">Бронза I</span>
          <div class="pf-xp"><span class="pf-xp-fill"></span></div>
        </div>
        <div class="pf-frame"><div class="pf-avatar"></div></div>
      </div>
      <div class="pf-scrollbar"><span class="pf-scrollbar-thumb"></span></div>
    </div>
    <div id="mode-center">
      <h2 id="mode-title">Выбери режим</h2>
      <div id="mode-buttons">
        <button class="btn menu-btn menu-btn-secondary mode-card sea-mode" id="mode-fast">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L4 14 h7 l-1 8 9-12 h-7 z"/></svg>
          <span>Быстрый</span>
        </button>
        <button class="btn menu-btn menu-btn-secondary mode-card sea-mode" id="mode-classic">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9 3.5 v17 M15 3.5 v17 M3.5 9 h17 M3.5 15 h17"/></svg>
          <span>Классика</span>
        </button>
        <button class="btn menu-btn menu-btn-secondary mode-card snake-mode" id="mode-snake-classic">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9 3.5 v17 M15 3.5 v17 M3.5 9 h17 M3.5 15 h17"/></svg>
          <span>Классика</span>
        </button>
        <button class="btn menu-btn menu-btn-secondary mode-card snake-mode" id="mode-snake-arena">
          <svg class="menu-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6 h7 a3 3 0 0 1 0 6 H8 a3 3 0 0 0 0 6 h6"/><circle cx="18.5" cy="18" r="1.4" fill="currentColor" stroke="none"/><path d="M3 3 h18 v18 h-18 z" opacity="0.35"/></svg>
          <span>Арена</span>
        </button>
      </div>
    </div>
  </div>

  <div id="snake-screen" class="hidden">
    <div id="snake-particles"></div>
    <div class="mode-topbar">
      <svg class="logo-cross topbar-cross" id="snake-back-x" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      <span class="logo-text">BLINDGRID</span>
      <span class="logo-cube"></span>
    </div>
    <div id="snake-center">
      <div class="snake-board-wrap mini-wrap">
        <div class="board-label"><span>противник</span><span class="snake-lives" id="snake-ai-hearts"></span></div>
        <div class="snake-grid mini" id="snake-ai"></div>
      </div>
      <div id="snake-divider"></div>
      <div class="snake-board-wrap big-wrap">
        <div class="board-label"><span>ты</span><span class="snake-lives" id="snake-me-hearts"></span></div>
        <div class="snake-grid-holder">
          <div id="snake-combo-tag"></div>
          <div class="snake-grid big" id="snake-me"></div>
        </div>
        <div id="snake-hunger">
          <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.4 V12 L15.4 14.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="snake-hunger-n"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="arena-screen" class="hidden">
    <div id="arena-particles"></div>
    <div class="mode-topbar">
      <svg class="logo-cross topbar-cross" id="arena-back-x" viewBox="0 0 24 24" width="19" height="19"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
      <span class="logo-text">BLINDGRID</span>
      <span class="logo-cube"></span>
    </div>
    <div id="arena-center">
      <div class="arena-lives">
        <span class="snake-lives arena-hearts" id="arena-ai-hearts" style="--hc:#ffb259"></span>
        <span class="snake-lives arena-hearts" id="arena-me-hearts" style="--hc:#4fcac4"></span>
      </div>
      <div id="arena-field-holder">
        <div id="arena-field"></div>
        <div class="snake-dim" id="arena-dim"><span class="snake-num" id="arena-num"></span></div>
      </div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="ov-result"><h1 id="overlay-title"><span class="logo-text">ПОБЕДА!</span></h1></div>
    <div id="ov-xp">
      <div id="ov-cat-burst"></div>
      <div id="ov-frame-wrap"><div id="ov-frame"><div id="ov-ava"></div></div></div>
      <div id="ov-rankup">Повышение!</div>
      <div id="ov-rank-name">Бронза I</div>
      <div id="ov-tally"><span class="ov-fruit"></span><span id="ov-tally-n">0</span></div>
      <div id="ov-xp-bar"><span id="ov-xp-ghost"></span><span id="ov-xp-fill"></span></div>
      <div id="ov-xp-gain">+0 XP</div>
    </div>
    <div id="ov-actions">
      <button class="btn menu-btn menu-btn-secondary" id="overlay-btn">Ещё раз</button>
      <button class="btn menu-btn menu-btn-secondary" id="overlay-back">Назад</button>
    </div>
  </div>
</div>

<script src="index.js?v=43"></script>
</body>
</html>
